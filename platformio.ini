[env:m5stack-cores3]
platform      = espressif32
board         = m5stack-cores3
framework     = arduino

board_build.filesystem = spiffs

lib_deps =
    m5stack/M5Unified @ ^0.2.0
    bblanchon/ArduinoJson @ ^7.0.0
    espressif/esp32-camera @ ^2.0.4

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=5          ; 最详细日志（调试用，稳定后改回 1）
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1   ; USB CDC 串口（CoreS3 必须）
    -DARDUINO_USB_MODE=1          ; USB 工作在 CDC 模式，不是 JTAG

[env:m5stack-cores3-debug]
extends        = env:m5stack-cores3
build_type     = debug
build_flags    =
    ${env:m5stack-cores3.build_flags}
    -g                            ; 保留调试符号，配合 esp32_exception_decoder
    -Og                           ; 调试优化级别
